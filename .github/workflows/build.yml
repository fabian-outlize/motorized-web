name: Seiten neu bauen

# Läuft, sobald sich Inhalte oder Vorlagen ändern — also auch dann,
# wenn im CMS auf „Veröffentlichen" geklickt wurde.
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'tools/**'
  workflow_dispatch:

concurrency:
  group: seiten-bauen
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: HTML aus content/ erzeugen
        run: python3 tools/rebuild.py

      - name: Ergebnis zurückschreiben
        run: |
          git config user.name  "motorized-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "Keine Änderungen an den HTML-Dateien."
            exit 0
          fi
          git add -A
          git commit -m "Seiten neu gebaut [skip ci]"
          git push
